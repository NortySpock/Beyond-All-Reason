name: Unit Tests (busted)

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  unit_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Lua 5.1 and luarocks
      uses: leafo/gh-actions-luarocks@v1
      with:
        luaVersion: "5.1"

    - name: Install busted
      run: luarocks install busted

    - name: Run busted
      run: busted
